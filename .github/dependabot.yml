# =============================================================================
# Dependabot - .github/dependabot.yml
# =============================================================================
# WHAT IT IS
#   A GitHub robot that checks for newer versions of everything we depend on
#   and opens pull requests to update them. CI then tests each update like any
#   other change, so you merge only updates that pass.
#
# WHY
#   Outdated packages collect bugs and security holes. Updating a little and
#   often is far easier than a big, scary upgrade once a year.
#   (Separately, GitHub's "Dependabot security updates" setting opens urgent
#   pull requests for known vulnerabilities; see the README's settings guide.)
#
# KEYS USED BELOW
#   package-ecosystem         which kind of dependency file to read
#   directory / directories   where those files are
#   schedule.interval         how often to check (daily, weekly, monthly)
#   open-pull-requests-limit  maximum update pull requests open at once
#   groups                    bundle related updates into ONE pull request
#   ignore                    dependencies Dependabot must not update
#   commit-message.prefix     a tag at the start of each update's title
# =============================================================================

version: 2

updates:
  # --- Python packages: pyproject.toml + uv.lock ----------------------------
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One pull request for all small (minor/patch) updates, instead of one each.
    # Major updates (possible breaking changes) still get their own.
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    # scikit-learn is upgraded deliberately, never automatically: the saved
    # model must be loaded by the exact version that trained it. Upgrading
    # means: change the pin, retrain, re-snapshot the demo baseline.
    # (If it were updated anyway, CI's model quality gate would catch the mismatch.)
    ignore:
      - dependency-name: "scikit-learn"
    commit-message:
      prefix: "deps"

  # --- GitHub Actions used in .github/workflows/*.yml ------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # --- Docker base images in Dockerfile and ui/Dockerfile --------------------
  - package-ecosystem: "docker"
    directories: ["/", "/ui"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
